<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>核心业务中心 - 速芯算力</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{--background:#fff;--foreground:#0f172a;--muted:#f6f8f7;--muted-foreground:#64746d;--border:#e3e8e5;--primary:#16a34a;--primary-foreground:#fff;--radius:8px;--shadow:0 1px 2px rgba(16,24,40,.06),0 16px 40px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;background:#fff;color:var(--foreground)}a{text-decoration:none;color:inherit}.page{min-height:100vh;background:linear-gradient(180deg,#fff,#f7fbf8 55%,#fff)}
    .topbar{height:76px;padding:0 5.4%;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.92);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.brand{width:170px;display:flex;align-items:center;gap:10px;font-weight:800;color:#0f172a}.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 8px 18px rgba(22,163,74,.18)}.brand-text{font-size:21px;line-height:1;white-space:nowrap}.main-nav{flex:1;display:flex;justify-content:center;gap:30px;font-size:15px;font-weight:700;color:#33413a}.main-nav a{height:76px;display:flex;align-items:center;position:relative;white-space:nowrap}.main-nav a.active{color:var(--primary)}.main-nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--primary);border-radius:999px}.nav-actions{display:flex;gap:12px;font-size:14px;font-weight:700}.ghost-action,.solid-action{height:40px;padding:0 16px;border-radius:var(--radius);display:flex;align-items:center;gap:8px;white-space:nowrap}.ghost-action{border:1px solid var(--border);background:#fff}.solid-action{background:var(--primary);color:#fff}.menu-button{display:none}
    .head{text-align:center;padding:52px 20px 38px;border-bottom:1px solid var(--border);background:radial-gradient(circle at 50% 0,rgba(22,163,74,.12),transparent 34%),#fff}.head h1{font-size:38px;margin:0 0 14px;font-weight:800}.head p{font-size:18px;margin:0;color:var(--muted-foreground);font-weight:700}.business-grid{width:min(1320px,92vw);margin:34px auto 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.business-card{min-height:290px;padding:28px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;gap:16px;transition:.18s}.business-card:hover{transform:translateY(-2px);border-color:rgba(22,163,74,.45)}.business-card:before,.business-card:after{display:none}.business-card i{font-size:34px;color:var(--primary);display:block}.business-card h2{font-size:23px;line-height:1.25;margin:0;font-weight:800}.business-card p{font-size:15px;line-height:1.65;margin:0;color:var(--muted-foreground);font-weight:600}.business-card a{margin-top:auto;height:40px;min-width:118px;padding:0 14px;border:1px solid var(--border);border-radius:var(--radius);display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--foreground);font-size:14px;font-weight:700;align-self:flex-start;background:#fff}.business-card a:hover{color:var(--primary);background:#f0fdf4;border-color:rgba(22,163,74,.45)}.booking{width:min(1320px,92vw);margin:0 auto 56px;background:#fff;color:#111;border:1px solid var(--border);border-radius:var(--radius);padding:18px;display:grid;grid-template-columns:140px 1fr 132px 1fr;gap:12px;align-items:center;box-shadow:var(--shadow)}.booking label{font-size:14px;font-weight:800;color:var(--primary)}.booking input{height:40px;border:1px solid #d9e1dc;border-radius:var(--radius);font-size:14px;padding:0 12px}.booking button{height:40px;border:0;border-radius:var(--radius);background:var(--primary);color:#fff;font-size:14px;font-weight:700}.site-footer{border-top:1px solid var(--border);background:#fff;padding:28px 24px}.footer-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.footer-actions a{height:40px;min-width:150px;border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700}.footer-meta{display:none}.watermark{display:none}
    @media(max-width:1280px){.topbar{gap:18px}.brand{width:150px}.main-nav{gap:18px;font-size:14px}.nav-actions{display:none}.business-grid{grid-template-columns:1fr 1fr}.booking{grid-template-columns:1fr}}@media(max-width:960px){.main-nav{display:none}.menu-button{display:block;margin-left:auto;background:var(--primary);border:0;color:#fff;border-radius:var(--radius);width:42px;height:38px;font-size:22px}.topbar.open{display:grid;grid-template-columns:1fr auto;height:auto;padding:16px 28px}.topbar.open .menu-button{grid-column:2;grid-row:1;justify-self:end;align-self:center}.topbar.open .main-nav,.topbar.open .nav-actions{grid-column:1/3;display:flex;flex-direction:column;align-items:flex-start}.topbar.open .main-nav a{height:auto;padding:8px 0}}@media(max-width:760px){.head h1{font-size:32px}.head p{font-size:16px}.business-grid{grid-template-columns:1fr;width:92vw}.business-card{min-height:0}.booking{width:92vw}}
    .topbar{height:76px;padding:0 clamp(28px,5.4vw,104px);gap:24px}.brand{width:170px}.main-nav{display:flex;gap:clamp(14px,1.4vw,30px);font-size:15px}.nav-actions{display:flex;align-items:center;gap:12px}.menu-button{display:none}@media(max-width:1320px){.topbar{padding:0 5%;gap:18px}.brand{width:150px}.main-nav{gap:14px;font-size:14px}.nav-actions{display:none}}@media(max-width:860px){.topbar{height:auto;min-height:76px;padding:16px 20px}.main-nav{display:none}.menu-button{display:block;margin-left:auto;border:0;background:var(--primary);color:#fff;border-radius:var(--radius);width:42px;height:38px;font-size:22px}.topbar.open{display:grid;grid-template-columns:1fr auto;align-items:start;height:auto}.topbar.open .menu-button{grid-column:2;grid-row:1;justify-self:end;align-self:center}.topbar.open .main-nav,.topbar.open .nav-actions{grid-column:1/3;display:flex;flex-direction:column;align-items:flex-start;gap:8px}.topbar.open .main-nav a{height:auto;padding:8px 0}.topbar.open .main-nav a.active:after{display:none}}
  </style>
</head>
<body data-page="business">
  <div class="page">
    <div id="site-nav"></div>
    <section class="head"><h1>核心业务中心</h1><p>算力硬件 | 机房租赁 | 企业方案 | 跨境出海 | 园区项目 | 渠道招商</p></section>
    <main>
      <section class="business-grid">
        <article class="business-card"><i class="ri-file-list-3-line"></i><h2>算力硬件整机销售</h2><p>8卡RTX5090整机、电费实缴托管、3/5年长协方案</p><a href="consult.html">咨询配置 <i class="ri-arrow-right-s-line"></i></a></article>
        <article class="business-card"><i class="ri-stack-line"></i><h2>机房算力租赁</h2><p>裸金属分时包月、推理训练分区、绿电与涉密算力</p><a href="cooperation.html">预约托管 <i class="ri-arrow-right-s-line"></i></a></article>
        <article class="business-card"><i class="ri-map-pin-user-line"></i><h2>本地企业AIGC方案</h2><p>电商、MCN、广告、工业质检、政务、教培、文旅</p><a href="consult.html">查看场景 <i class="ri-arrow-right-s-line"></i></a></article>
        <article class="business-card"><i class="ri-arrow-down-line"></i><h2>跨境Token算力出海</h2><p>隔离来数加工、海外AI工具、短剧与广告算力</p><a href="cases.html">查看案例 <i class="ri-arrow-right-s-line"></i></a></article>
        <article class="business-card"><i class="ri-shield-check-line"></i><h2>源网荷储算力园区</h2><p>和丰、和田园区共建、绿电直连、投资测算</p><a href="about.html">了解园区 <i class="ri-arrow-right-s-line"></i></a></article>
        <article class="business-card"><i class="ri-vip-crown-line"></i><h2>渠道算力招商加盟</h2><p>三重收益、批量政策、会销扶持、渠道标杆</p><a href="cooperation.html">申请合作 <i class="ri-arrow-right-s-line"></i></a></article>
      </section>
      <form class="booking"><label><i class="ri-add-line"></i> 业务对接预约：</label><input aria-label="姓名" placeholder="姓名 / 企业"><button type="button">提交预约</button><input aria-label="需求说明" placeholder="需求说明"></form>
    </main>
    <div id="site-footer"></div><div class="watermark">豆包AI生成</div>
  </div>
  <script src="scripts/site-config.js"></script>
  <script>
    async function include(id,file){const el=document.getElementById(id);el.innerHTML=await (await fetch(file + "?v=nav-pages-2")).text();}
    Promise.all([include("site-nav","partials/nav.html"),include("site-footer","partials/footer.html")]).then(()=>{const page=document.body.dataset.page;document.querySelectorAll(`[data-page="${page}"]`).forEach(a=>a.classList.add("active"));document.querySelector(".menu-button")?.addEventListener("click",()=>document.querySelector(".topbar").classList.toggle("open"));window.SuxinSiteConfig?.apply?.();});
  </script>
</body>
</html>
