<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于速芯 - 一体化算力基础设施服务商</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{--background:#fff;--foreground:#0f172a;--muted:#f6f8f7;--muted-foreground:#64746d;--border:#e3e8e5;--primary:#16a34a;--radius:8px;--shadow:0 1px 2px rgba(16,24,40,.06),0 16px 40px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;background:#fff;color:var(--foreground)}a{text-decoration:none;color:inherit}.page{min-height:100vh;background:linear-gradient(180deg,#fff,#f7fbf8 55%,#fff)}
    .topbar{height:76px;padding:0 5.4%;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.92);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.brand{width:170px;display:flex;align-items:center;gap:10px;font-weight:800;color:#0f172a}.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 8px 18px rgba(22,163,74,.18)}.brand-text{font-size:21px;line-height:1;white-space:nowrap}.main-nav{flex:1;display:flex;justify-content:center;gap:30px;font-size:15px;font-weight:700;color:#33413a}.main-nav a{height:76px;display:flex;align-items:center;position:relative;white-space:nowrap}.main-nav a.active{color:var(--primary)}.main-nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--primary);border-radius:999px}.nav-actions{display:flex;gap:12px;font-size:14px;font-weight:700}.ghost-action,.solid-action{height:40px;padding:0 16px;border-radius:var(--radius);display:flex;align-items:center;gap:8px;white-space:nowrap}.ghost-action{border:1px solid var(--border);background:#fff}.solid-action{background:var(--primary);color:#fff}.menu-button{display:none}
    .hud{width:min(1320px,92vw);margin:0 auto;padding:0 0 56px}.hud:before,.hud:after{display:none}.title{text-align:center;padding:52px 20px 38px;border-bottom:1px solid var(--border);margin:0 calc(50% - 50vw);background:radial-gradient(circle at 50% 0,rgba(22,163,74,.12),transparent 34%),#fff}.title h1{font-size:38px;margin:0 0 14px;font-weight:800}.title p{font-size:18px;margin:0;color:var(--muted-foreground);font-weight:700}.intro{display:grid;grid-template-columns:.75fr 1.25fr;border:1px solid var(--border);border-radius:var(--radius);background:#fff;min-height:360px;overflow:hidden;box-shadow:var(--shadow);margin-top:34px}.intro-copy{padding:36px}.section-title{margin:0 0 22px;font-size:22px;font-weight:800;display:flex;gap:10px;align-items:center}.section-title:before{content:"";width:4px;height:22px;background:var(--primary);border-radius:999px}.intro-copy p{font-size:18px;line-height:1.8;margin:0 0 18px;font-weight:700;color:#33413a}.intro-copy mark{background:#f0fdf4;color:var(--primary);padding:3px 8px;border-radius:999px}.intro img{width:100%;height:100%;object-fit:cover}
    .timeline{margin:24px 0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:start;margin-top:22px;position:relative}.steps:after{display:none}.step{text-align:center;position:relative;border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:var(--muted)}.step strong{display:block;background:#fff;border-radius:999px;padding:8px 10px;font-size:14px;color:#33413a}.step span{display:block;width:12px;height:12px;border-radius:50%;background:var(--primary);margin:14px auto 0}.cards{display:grid;grid-template-columns:1.2fr .8fr 1.3fr;gap:18px}.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-height:260px;box-shadow:var(--shadow)}.capability{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.chip{height:118px;background:#f0fdf4;border:1px solid rgba(22,163,74,.24);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--primary);clip-path:none}.panel img{width:var(--panel-image-width,100%);height:var(--panel-image-height,170px);object-fit:cover;display:block;border-radius:calc(var(--radius) - 2px);border:1px solid var(--border);margin:0 auto}.panel.panel-image-contain img{max-width:100%;height:var(--panel-image-height,auto);object-fit:contain}.site-footer{border-top:1px solid var(--border);background:#fff;padding:28px 24px}.footer-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.footer-actions a{height:40px;min-width:150px;border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700}.footer-meta{display:none}.watermark{display:none}
    @media(max-width:1280px){.topbar{gap:18px}.brand{width:150px}.main-nav{gap:18px;font-size:14px}.nav-actions{display:none}.intro,.cards{grid-template-columns:1fr}.steps{grid-template-columns:repeat(2,1fr)}}@media(max-width:960px){.main-nav{display:none}.menu-button{display:block;margin-left:auto;background:var(--primary);border:0;color:#fff;border-radius:var(--radius);width:42px;height:38px;font-size:22px}.topbar.open{display:grid;grid-template-columns:1fr auto;height:auto;padding:16px 28px}.topbar.open .menu-button{grid-column:2;grid-row:1;justify-self:end;align-self:center}.topbar.open .main-nav,.topbar.open .nav-actions{grid-column:1/3;display:flex;flex-direction:column;align-items:flex-start}.topbar.open .main-nav a{height:auto;padding:8px 0}}@media(max-width:760px){.title h1{font-size:32px}.title p{font-size:16px}.intro-copy{padding:24px}.steps,.capability{grid-template-columns:1fr}}
    .topbar{height:76px;padding:0 clamp(28px,5.4vw,104px);gap:24px}.brand{width:170px}.main-nav{display:flex;gap:clamp(14px,1.4vw,30px);font-size:15px}.nav-actions{display:flex;align-items:center;gap:12px}.menu-button{display:none}@media(max-width:1320px){.topbar{padding:0 5%;gap:18px}.brand{width:150px}.main-nav{gap:14px;font-size:14px}.nav-actions{display:none}}@media(max-width:860px){.topbar{height:auto;min-height:76px;padding:16px 20px}.main-nav{display:none}.menu-button{display:block;margin-left:auto;border:0;background:var(--primary);color:#fff;border-radius:var(--radius);width:42px;height:38px;font-size:22px}.topbar.open{display:grid;grid-template-columns:1fr auto;align-items:start;height:auto}.topbar.open .menu-button{grid-column:2;grid-row:1;justify-self:end;align-self:center}.topbar.open .main-nav,.topbar.open .nav-actions{grid-column:1/3;display:flex;flex-direction:column;align-items:flex-start;gap:8px}.topbar.open .main-nav a{height:auto;padding:8px 0}.topbar.open .main-nav a.active:after{display:none}}
  </style>
</head>
<body data-page="about">
  <div class="page">
    <div id="site-nav"></div>
    <main class="hud">
      <section class="title"><h1>关于速芯</h1><p>一体化算力基础设施服务商</p></section>
      <section class="intro">
        <div class="intro-copy"><h2 class="section-title">企业简介</h2><p>速芯算力围绕西藏、新疆等绿电资源建设算力基础设施，面向企业客户提供GPU整机销售、智算机房托管、AIGC应用降本与跨境算力出海服务。</p><p>团队从硬件选型、机房交付、运维保障到业务场景测算一体化推进，帮助客户把算力采购、资产托管和AI应用落到可执行的项目方案。</p><p><mark>硬件销售 | 机房托管 | 企业算力 | 跨境数字服务</mark></p></div>
        <img src="assets/materials/factory-aerial.png" alt="速芯算力园区航拍">
      </section>
      <section class="timeline"><h2 class="section-title">发展历程</h2><div class="steps"><div class="step"><strong>西藏算力项目起步</strong><span></span></div><div class="step"><strong>和丰源网荷储落地</strong><span></span></div><div class="step"><strong>和田园区合作推进</strong><span></span></div><div class="step"><strong>5090硬件方案发布</strong><span></span></div><div class="step"><strong>跨境算力服务上线</strong><span></span></div><div class="step"><strong>全国渠道招商启动</strong><span></span></div></div></section>
      <section class="cards">
        <article class="panel"><h2 class="section-title">企业实力</h2><div class="capability"><div class="chip">算力储备</div><div class="chip">绿电资源</div><div class="chip">运维团队</div></div></article>
        <article class="panel panel-image-contain"><h2 class="section-title">核心管理团队</h2><img src="assets/materials/team-portraits.png" alt="核心管理团队"></article>
        <article class="panel panel-image-contain"><h2 class="section-title">资证荣誉</h2><img src="assets/materials/certificates.png" alt="资质证书与荣誉"></article>
      </section>
    </main>
    <div id="site-footer"></div><div class="watermark">豆包AI生成</div>
  </div>
  <script src="scripts/site-config.js"></script>
  <script>
    async function include(id,file){const el=document.getElementById(id);el.innerHTML=await (await fetch(file + "?v=nav-pages-2")).text();}
    Promise.all([include("site-nav","partials/nav.html"),include("site-footer","partials/footer.html")]).then(()=>{const page=document.body.dataset.page;document.querySelectorAll(`[data-page="${page}"]`).forEach(a=>a.classList.add("active"));document.querySelector(".menu-button")?.addEventListener("click",()=>document.querySelector(".topbar").classList.toggle("open"));window.SuxinSiteConfig?.apply?.();});
  </script>
</body>
</html>
