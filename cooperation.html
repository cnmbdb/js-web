<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>招商合作 - 速芯算力</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{--background:#fff;--foreground:#0f172a;--card:#fff;--card-foreground:#0f172a;--muted:#f6f8f7;--muted-foreground:#66736d;--border:#e3e8e5;--input:#d9e1dc;--primary:#16a34a;--primary-foreground:#fff;--ring:rgba(22,163,74,.24);--radius:8px;--shadow:0 1px 2px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;background:var(--background);color:var(--foreground);min-width:320px}a{text-decoration:none;color:inherit}.page{min-height:100vh;background:linear-gradient(180deg,#fff 0,#f7fbf8 54%,#fff 100%)}
    .topbar{height:76px;padding:0 5.4%;display:flex;align-items:center;gap:28px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.brand{width:170px;display:flex;align-items:center;gap:10px;font-weight:800;color:#0f172a}.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 8px 18px rgba(22,163,74,.18)}.brand-text{font-size:21px;line-height:1;white-space:nowrap}.main-nav{flex:1;display:flex;justify-content:center;gap:30px;font-size:15px;font-weight:700;color:#33413a}.main-nav a{height:76px;display:flex;align-items:center;position:relative;white-space:nowrap}.main-nav a.active{color:var(--primary)}.main-nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--primary);border-radius:999px}.nav-actions{display:flex;gap:12px;font-size:14px;font-weight:700}.ghost-action,.solid-action{height:40px;padding:0 16px;border-radius:var(--radius);display:flex;align-items:center;gap:8px;white-space:nowrap;transition:.18s}.ghost-action{border:1px solid var(--border);background:var(--background);color:var(--foreground)}.ghost-action:hover{background:var(--muted)}.solid-action{background:var(--primary);color:var(--primary-foreground);box-shadow:0 8px 18px rgba(22,163,74,.18)}.solid-action:hover,.primary-btn:hover{background:#15803d}.menu-button{display:none}
    .page-head{text-align:center;padding:44px 24px 34px;border-bottom:1px solid var(--border);background:radial-gradient(circle at 50% 0,rgba(22,163,74,.12),transparent 34%),#fff}.page-head h1{font-size:38px;margin:0 0 16px;font-weight:800;letter-spacing:0}.page-head p{margin:0;color:var(--muted-foreground);font-size:18px;font-weight:700}.wrap{max-width:1440px;margin:0 auto;padding:34px 48px 64px}.partner-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:28px}.partner-card{height:150px;background:var(--card);color:var(--card-foreground);border-radius:var(--radius);border:1px solid var(--border);padding:24px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);transition:.18s}.partner-card:hover{transform:translateY(-2px);border-color:rgba(22,163,74,.42);box-shadow:0 18px 42px rgba(22,163,74,.12)}.partner-card i{font-size:32px;color:var(--primary)}.partner-card strong{font-size:20px;line-height:1.2;font-weight:800}
    .forms{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}.form-panel,.download-panel{background:var(--card);color:var(--card-foreground);border-radius:var(--radius);border:1px solid var(--border);padding:28px;box-shadow:var(--shadow)}.form-panel h2,.download-panel h2{margin:0 0 22px;font-size:22px;color:var(--foreground);font-weight:800}.form-panel h2 i{font-size:20px;color:var(--primary)}.form-grid{display:grid;grid-template-columns:86px 1fr 86px 1fr;gap:16px;align-items:center}.form-grid label{font-size:14px;font-weight:700;color:var(--foreground)}.field{height:44px;min-width:0;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);padding:0 12px;font-size:14px;color:var(--muted-foreground);background:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;transition:border-color .18s,box-shadow .18s}.field i{flex:0 0 auto}.field:focus-within,.field:hover{border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}.field.form-input{display:block;width:100%;font:inherit;outline:0}.field.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}.field.small{max-width:154px}.btn-row{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:4px}.primary-btn{height:40px;min-width:132px;border:0;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font-size:14px;font-weight:700;box-shadow:0 8px 18px rgba(22,163,74,.18);cursor:pointer}.download-panel{padding:28px}.download-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.download-card{height:104px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;padding:20px;text-align:left;font-size:17px;font-weight:800;display:flex;align-items:center;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:.18s}.download-card:hover{border-color:rgba(22,163,74,.5);color:var(--primary);background:#f8fdf9}.site-footer{padding:28px 24px 36px;border-top:1px solid var(--border);background:#fff}.footer-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.footer-actions a{height:40px;min-width:150px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;color:var(--foreground)}.footer-actions a:hover{background:var(--muted);color:var(--primary)}.footer-meta{display:none}.watermark{display:none}
    @media(max-width:1600px){.topbar{height:88px;padding:0 5%;gap:20px}.brand{width:140px}.main-nav{gap:22px;font-size:16px}.nav-actions{font-size:15px;gap:10px}.ghost-action,.solid-action{height:44px;padding:0 14px}.page-head{padding-top:28px}.page-head h1{font-size:36px}.page-head p{font-size:23px}.wrap{padding:16px 48px 46px}.partner-grid{gap:26px}.partner-card{height:188px;padding:42px 26px;gap:22px}.partner-card i{font-size:38px}.partner-card strong{font-size:23px}.forms{gap:28px}.form-panel,.download-panel{padding:30px 32px;min-width:0}.form-panel h2,.download-panel h2{font-size:27px}.form-grid{grid-template-columns:78px 1fr 78px 1fr;gap:18px 18px;min-width:0}.form-grid label{font-size:17px}.field{height:52px;font-size:17px;min-width:0}.download-grid{gap:24px}.download-card{height:140px;font-size:24px}.footer-actions a{height:54px;min-width:190px;font-size:20px}}@media(max-width:1280px){.wrap{padding:18px 28px}.partner-grid{grid-template-columns:repeat(2,1fr)}.forms{grid-template-columns:1fr}.download-grid{grid-template-columns:repeat(2,1fr)}.topbar{gap:18px}.main-nav{gap:16px;font-size:14px}.nav-actions{display:none}}@media(max-width:960px){.main-nav{display:none}.menu-button{display:block;margin-left:auto;border:0;background:var(--primary);color:#fff;border-radius:var(--radius);width:42px;height:38px;font-size:22px}.topbar.open{display:grid;grid-template-columns:1fr auto}.topbar.open .menu-button{grid-column:2;grid-row:1;justify-self:end;align-self:center}.topbar.open .main-nav,.topbar.open .nav-actions{grid-column:1/3;display:flex;flex-direction:column;align-items:flex-start}.topbar.open .main-nav a{height:auto;padding:8px 0}}@media(max-width:760px){.topbar{height:auto;padding:16px 20px}.brand{width:136px}.page-head h1{font-size:32px}.page-head p{font-size:19px}.partner-grid,.download-grid{grid-template-columns:1fr}.partner-card{height:auto;padding:34px}.form-panel,.download-panel{padding:24px 20px}.form-grid{grid-template-columns:1fr}.form-grid>*{grid-column:auto!important;width:100%}.form-grid label{margin-top:6px}.field.small{max-width:none}.watermark{display:none}}
    .topbar{height:76px;padding:0 clamp(28px,5.4vw,104px);gap:24px}.brand{width:170px}.main-nav{display:flex;gap:clamp(14px,1.4vw,30px);font-size:15px}.nav-actions{display:flex;align-items:center;gap:12px}.menu-button{display:none}@media(max-width:1320px){.topbar{padding:0 5%;gap:18px}.brand{width:150px}.main-nav{gap:14px;font-size:14px}.nav-actions{display:none}}@media(max-width:860px){.topbar{height:auto;min-height:76px;padding:16px 20px}.main-nav{display:none}.menu-button{display:block;margin-left:auto;border:0;background:var(--primary);color:#fff;border-radius:var(--radius);width:42px;height:38px;font-size:22px}.topbar.open{display:grid;grid-template-columns:1fr auto;align-items:start;height:auto}.topbar.open .menu-button{grid-column:2;grid-row:1;justify-self:end;align-self:center}.topbar.open .main-nav,.topbar.open .nav-actions{grid-column:1/3;display:flex;flex-direction:column;align-items:flex-start;gap:8px}.topbar.open .main-nav a{height:auto;padding:8px 0}.topbar.open .main-nav a.active:after{display:none}}
  </style>
</head>
<body data-page="cooperation">
  <div class="page">
    <div id="site-nav"></div>
    <section class="page-head">
      <h1>招商合作</h1>
      <p>企业算力采购 | 硬件投资人 | 渠道合伙人 | 园区政企共建 | 海外算力服务商</p>
    </section>
    <main class="wrap">
      <section class="partner-grid">
        <a class="partner-card" href="#forms"><i class="ri-shield-check-line"></i><strong>企业算力采购</strong></a>
        <a class="partner-card" href="#forms"><i class="ri-user-location-line"></i><strong>硬件个人投资人</strong></a>
        <a class="partner-card" href="#forms"><i class="ri-global-line"></i><strong>渠道区域合伙人</strong></a>
        <a class="partner-card" href="#forms"><i class="ri-shield-star-line"></i><strong>园区政企共建</strong></a>
        <a class="partner-card" href="#forms"><i class="ri-shield-check-line"></i><strong>海外算力服务商</strong></a>
      </section>
      <section id="forms" class="forms">
        <form class="form-panel" data-consult-form="partner-intent">
          <h2>合作意向登记表单 <i class="ri-arrow-right-s-line"></i></h2>
          <div class="form-grid">
            <label for="partner-name">姓名</label><input class="field form-input" id="partner-name" name="name" placeholder="姓名" required>
            <label for="partner-phone">电话</label><input class="field form-input" id="partner-phone" name="phone" placeholder="电话" required>
            <label for="partner-type">伙伴类型</label><input class="field form-input" id="partner-type" name="partner-type" placeholder="渠道 / 投资 / 园区" required>
            <label for="partner-industry">所在行业</label><input class="field form-input" id="partner-industry" name="industry" placeholder="企业 / 能源 / 海外" required>
            <label for="partner-need">算力需求</label><input class="field form-input" id="partner-need" name="compute-need" placeholder="采购 / 托管 / 租赁" required>
            <label for="partner-budget">预算范围</label><input class="field form-input" id="partner-budget" name="budget" placeholder="预算或采购规模" required>
            <div class="btn-row"><button class="primary-btn" type="submit">提交合作意向</button></div>
          </div>
        </form>
        <form class="form-panel" data-consult-form="visit-intent">
          <h2>机房实地考察预约表单 <i class="ri-arrow-right-s-line"></i></h2>
          <div class="form-grid">
            <label for="visit-contact">联系方式</label><input class="field form-input" id="visit-contact" name="contact" placeholder="联系方式" style="grid-column:span 3" required>
            <label for="visit-count">到访人数</label><input class="field form-input" id="visit-count" name="visitors" placeholder="到访人数" required>
            <label for="visit-time">意向</label><input class="field form-input" id="visit-time" name="time" placeholder="意向到访时间" required>
            <label for="visit-focus">考察重点</label><input class="field form-input" id="visit-focus" name="focus" placeholder="机房 / 电力" required>
            <label for="visit-remark">备注需求</label><input class="field form-input" id="visit-remark" name="remark" placeholder="托管 / 渠道政策" required>
            <div class="btn-row"><button class="primary-btn" type="submit">提交考察预约</button></div>
          </div>
        </form>
      </section>
      <section class="download-panel">
        <h2>合作资料下载区</h2>
        <div class="download-grid">
          <a class="download-card" href="#">5090硬件参数</a>
          <a class="download-card" href="#">收益测算表</a>
          <a class="download-card" href="#">渠道招商政策</a>
          <a class="download-card" href="#">园区合作方案</a>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <div class="watermark">豆包AI生成</div>
  </div>
  <script src="scripts/site-config.js"></script>
  <script>
    async function include(id,file){const el=document.getElementById(id);el.innerHTML=await (await fetch(file + "?v=nav-pages-2")).text();}
    Promise.all([include("site-nav","partials/nav.html"),include("site-footer","partials/footer.html")]).then(()=>{const page=document.body.dataset.page;document.querySelectorAll(`[data-page="${page}"]`).forEach(a=>a.classList.add("active"));document.querySelector(".menu-button")?.addEventListener("click",()=>document.querySelector(".topbar").classList.toggle("open"));window.SuxinSiteConfig?.apply?.();});
  </script>
</body>
</html>
