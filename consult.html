<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应用场景 - 速芯算力</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root{--background:#fff;--foreground:#0f172a;--muted:#f6f8f7;--muted-foreground:#64746d;--border:#e3e8e5;--input:#d9e1dc;--primary:#16a34a;--radius:8px;--shadow:0 1px 2px rgba(16,24,40,.06),0 16px 40px rgba(16,24,40,.08);--ring:rgba(22,163,74,.22)}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",Arial,sans-serif;background:#fff;color:var(--foreground)}a{text-decoration:none;color:inherit}.page{min-height:100vh;background:linear-gradient(180deg,#fff,#f7fbf8 55%,#fff)}
    .topbar{height:76px;padding:0 5.4%;display:flex;align-items:center;gap:28px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.92);position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.brand{width:170px;display:flex;align-items:center;gap:10px;font-weight:800;color:#0f172a}.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 8px 18px rgba(22,163,74,.18)}.brand-text{font-size:21px;line-height:1;white-space:nowrap}.main-nav{flex:1;display:flex;justify-content:center;gap:30px;font-size:15px;font-weight:700;color:#33413a}.main-nav a{height:76px;display:flex;align-items:center;position:relative;white-space:nowrap}.main-nav a.active{color:var(--primary)}.main-nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--primary);border-radius:999px}.nav-actions{display:flex;gap:12px;font-size:14px;font-weight:700}.ghost-action,.solid-action{height:40px;padding:0 16px;border-radius:var(--radius);display:flex;align-items:center;gap:8px;white-space:nowrap}.ghost-action{border:1px solid var(--border);background:#fff}.solid-action{background:var(--primary);color:#fff}.menu-button{display:none}
    .head{text-align:center;padding:52px 20px 38px;border-bottom:1px solid var(--border);background:radial-gradient(circle at 50% 0,rgba(22,163,74,.12),transparent 34%),#fff}.head h1{font-size:38px;margin:0 0 14px;font-weight:800}.head p{margin:0;color:var(--muted-foreground);font-size:18px;font-weight:700}.wrap{width:min(1320px,92vw);margin:34px auto 70px}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px}.quick a{height:118px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;box-shadow:var(--shadow);transition:.18s}.quick a:hover{transform:translateY(-2px);border-color:rgba(22,163,74,.45)}.quick i{margin-right:10px;color:var(--primary);font-size:22px}.forms{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}.panel h2{margin:0 0 20px;color:var(--foreground);font-size:22px;font-weight:800}.form-grid{display:grid;grid-template-columns:86px 1fr 86px 1fr;gap:16px;align-items:center}.form-grid label{font-weight:700;font-size:14px}.field{height:42px;min-width:0;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);padding:0 12px;color:var(--muted-foreground);display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}.field i{flex:0 0 auto}.field:hover{border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)}.btn{height:40px;min-width:124px;border:0;background:var(--primary);color:#fff;border-radius:var(--radius);font-weight:700}.btn-row{grid-column:1/-1;text-align:right}.downloads{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.download-card{height:96px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;display:flex;align-items:center;padding:18px;font-weight:800}.download-card:hover{background:#f0fdf4;color:var(--primary);border-color:rgba(22,163,74,.45)}.site-footer{border-top:1px solid var(--border);background:#fff;padding:28px 24px}.footer-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.footer-actions a{height:40px;min-width:150px;border:1px solid var(--border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700}.footer-meta{display:none}
    @media(max-width:1180px){.topbar{gap:18px}.brand{width:150px}.main-nav{gap:18px;font-size:14px}.nav-actions{display:none}}@media(max-width:1100px){.quick{grid-template-columns:repeat(2,1fr)}.forms{grid-template-columns:1fr}}@media(max-width:960px){.main-nav{display:none}.menu-button{display:block;margin-left:auto;background:var(--primary);border:0;color:#fff;border-radius:var(--radius);width:40px;height:36px}.topbar.open{display:grid;grid-template-columns:1fr auto;height:auto;padding:16px 28px}.topbar.open .menu-button{grid-column:2;grid-row:1;justify-self:end;align-self:center}.topbar.open .main-nav,.topbar.open .nav-actions{grid-column:1/3;display:flex;flex-direction:column;align-items:flex-start}.topbar.open .main-nav a{height:auto;padding:8px 0}}@media(max-width:720px){.head h1{font-size:32px}.head p{font-size:16px}.quick,.downloads{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid>*{grid-column:auto!important;width:100%}.field{height:44px}}
    .topbar{height:76px;padding:0 clamp(28px,5.4vw,104px);gap:24px}.brand{width:170px}.main-nav{display:flex;gap:clamp(14px,1.4vw,30px);font-size:15px}.nav-actions{display:flex;align-items:center;gap:12px}.menu-button{display:none}@media(max-width:1320px){.topbar{padding:0 5%;gap:18px}.brand{width:150px}.main-nav{gap:14px;font-size:14px}.nav-actions{display:none}}@media(max-width:860px){.topbar{height:auto;min-height:76px;padding:16px 20px}.main-nav{display:none}.menu-button{display:block;margin-left:auto;border:0;background:var(--primary);color:#fff;border-radius:var(--radius);width:42px;height:38px;font-size:22px}.topbar.open{display:grid;grid-template-columns:1fr auto;align-items:start;height:auto}.topbar.open .menu-button{grid-column:2;grid-row:1;justify-self:end;align-self:center}.topbar.open .main-nav,.topbar.open .nav-actions{grid-column:1/3;display:flex;flex-direction:column;align-items:flex-start;gap:8px}.topbar.open .main-nav a{height:auto;padding:8px 0}.topbar.open .main-nav a.active:after{display:none}}
  </style>
</head>
<body data-page="consult">
  <div class="page">
    <div id="site-nav"></div>
    <section class="head"><h1>应用场景</h1><p>电商内容生产 | MCN短视频 | 广告投放 | 工业质检 | 政务文旅 | 跨境业务</p></section>
    <main class="wrap">
      <section class="quick"><a href="#"><i class="ri-shopping-bag-3-line"></i>电商内容生产</a><a href="#"><i class="ri-video-line"></i>MCN短视频</a><a href="#"><i class="ri-megaphone-line"></i>广告投放优化</a><a href="#"><i class="ri-scan-2-line"></i>工业视觉质检</a><a href="#"><i class="ri-global-line"></i>跨境业务出海</a></section>
      <section class="forms">
        <form class="panel"><h2>应用方案测算表单</h2><div class="form-grid"><label>姓名</label><div class="field">姓名</div><label>电话</label><div class="field">电话</div><label>企业类型</label><div class="field">电商 / MCN / 工业</div><label>应用场景</label><div class="field">内容 / 视觉 / 投放</div><label>算力规模</label><div class="field">GPU数 / 并发</div><label>预算周期</label><div class="field">月度 / 季度 / 年度</div><div class="btn-row"><button class="btn" type="button">提交测算</button></div></div></form>
        <form class="panel"><h2>机房实地考察预约</h2><div class="form-grid"><label>联系方式</label><div class="field" style="grid-column:span 3">联系方式 <i class="ri-arrow-down-s-line"></i></div><label>到访人数</label><div class="field">到访人数</div><label>意向时间</label><div class="field">到访时间</div><label>考察重点</label><div class="field">环境 / 电力 / 运维</div><label>备注需求</label><div class="field">托管 / 租赁</div><div class="btn-row"><button class="btn" type="button">提交预约</button></div></div></form>
      </section>
      <section class="panel"><h2>场景资料下载</h2><div class="downloads"><a class="download-card" href="#">AIGC降本清单</a><a class="download-card" href="#">算力规模测算表</a><a class="download-card" href="#">行业场景方案</a><a class="download-card" href="#">机房考察清单</a></div></section>
    </main>
    <div id="site-footer"></div>
  </div>
  <script src="scripts/site-config.js"></script>
  <script>
    async function include(id,file){const el=document.getElementById(id);el.innerHTML=await (await fetch(file + "?v=nav-pages-2")).text();}
    Promise.all([include("site-nav","partials/nav.html"),include("site-footer","partials/footer.html")]).then(()=>{const page=document.body.dataset.page;document.querySelectorAll(`[data-page="${page}"]`).forEach(a=>a.classList.add("active"));document.querySelector(".menu-button")?.addEventListener("click",()=>document.querySelector(".topbar").classList.toggle("open"));window.SuxinSiteConfig?.apply?.();});
  </script>
</body>
</html>
