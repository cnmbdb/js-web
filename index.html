  <script>
    async function include(id,file){const el=document.getElementById(id);el.innerHTML=await (await fetch(file + "?v=nav-pages-2")).text();}
    function startCarousel(){const track=document.querySelector(".carousel-track");const dots=[...document.querySelectorAll(".carousel-dot")];if(!track||!dots.length)return;let index=0;setInterval(()=>{index=(index+1)%dots.length;track.style.transform=`translateX(-${index*100}%)`;dots.forEach((dot,i)=>dot.classList.toggle("active",i===index));},3200);}
    Promise.all([include("site-nav","partials/nav.html"),include("site-footer","partials/footer.html")]).then(()=>{const page=document.body.dataset.page;document.querySelectorAll(`[data-page="${page}"]`).forEach(a=>a.classList.add("active"));document.querySelector(".menu-button")?.addEventListener("click",()=>document.querySelector(".topbar").classList.toggle("open"));startCarousel();window.SuxinSiteConfig?.apply?.();});
  </script>
